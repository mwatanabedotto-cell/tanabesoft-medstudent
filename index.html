<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Biblioteca Clínica</title>
<meta name="description" content="Atlas interactivos, clases y recursos para estudiar medicina.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="estilo.css">
<style>
header{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-bottom:26px;border-bottom:1px solid var(--rule)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(34px,6vw,58px);line-height:1.04;letter-spacing:-.01em;margin:8px 0 12px;text-wrap:balance}
.lema{margin:0;max-width:60ch;color:var(--muted);font-size:17px}
.ficha{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;line-height:1.9;font-variant-numeric:tabular-nums}
.ficha b{color:var(--ink);font-weight:500;font-size:20px;display:block;line-height:1.1}
@media (max-width:600px){header{grid-template-columns:1fr}.ficha{text-align:left;display:flex;gap:24px}}
/* índice tipo pestañas de libro */
.indice{display:flex;flex-wrap:wrap;gap:6px;margin:26px 0 24px}
.tab{font:inherit;font-size:14px;padding:7px 14px 6px;border:1px solid var(--rule);border-bottom-width:3px;border-radius:8px 8px 4px 4px;background:var(--sheet);color:var(--muted);cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab small{font-family:var(--mono);font-size:11px;margin-left:6px;opacity:.7}
/* láminas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px}
.lam{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:border-color .15s,transform .15s}
.lam:hover{border-color:var(--muted);transform:translateY(-2px)}
.cover{position:relative;aspect-ratio:2/1;max-width:100%;border-bottom:1px solid var(--rule)}
.num{position:absolute;top:10px;left:12px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);background:var(--sheet);padding:2px 7px;border-radius:4px;border:1px solid var(--rule)}
.body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.meta .area{font-weight:600}
.meta .formato{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.lam h2{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.2;margin:0;text-wrap:balance}
.lam p{margin:0;color:var(--muted);font-size:15px;flex:1}
.pie{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;border-top:1px dashed var(--rule)}
.pie .soon{font-size:13px;color:var(--muted);font-style:italic}
.vacio{border:1px dashed var(--rule);border-radius:10px;padding:40px 20px;text-align:center;color:var(--muted)}
footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--rule);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer span{font-family:var(--mono)}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <div class="eyebrow">Recursos de estudio · Medicina</div>
      <h1 id="nombre">Biblioteca Clínica</h1>
      <p class="lema" id="lema">Atlas interactivos, clases y recursos para estudiar medicina.</p>
    </div>
    <div class="ficha" id="ficha"></div>
  </header>

  <nav class="indice" id="indice" aria-label="Filtrar por área"></nav>
  <div class="grid" id="grid"></div>
  <div class="vacio" id="vacio">Cargando láminas…</div>

  <footer>
    <span id="pie">© 2026 Biblioteca Clínica</span>
    <span>Material de estudio · no reemplaza la bibliografía oficial</span>
  </footer>
</main>

<script src="comun.js"></script>
<script>
const $ = id => document.getElementById(id), E = MED.esc;
let datos = [], area = 'Todas';
try { area = localStorage.getItem('med-area') || 'Todas'; } catch(e) {}
const pad = n => String(n).padStart(2, '0');

function dibujar(){
  const conteo = {};
  datos.forEach(d => { const a = d.cat || 'General'; conteo[a] = (conteo[a] || 0) + 1; });
  const areas = ['Todas', ...Object.keys(conteo)];
  if (!areas.includes(area)) area = 'Todas';
  $('indice').innerHTML = '';
  if (datos.length > 1) areas.forEach(a => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tab';
    b.setAttribute('aria-pressed', a === area);
    b.innerHTML = `${E(a)}<small>${a === 'Todas' ? datos.length : conteo[a]}</small>`;
    b.onclick = () => { area = a; try { localStorage.setItem('med-area', a); } catch(e) {} dibujar(); };
    $('indice').appendChild(b);
  });
  $('ficha').innerHTML = datos.length ? `<div><b>${pad(datos.length)}</b>láminas</div><div><b>${pad(Object.keys(conteo).length)}</b>áreas</div>` : '';
  const lista = datos.map((d, i) => ({...d, n: i + 1})).filter(d => area === 'Todas' || (d.cat || 'General') === area);
  $('grid').innerHTML = lista.map(d => `
    <article class="lam c-${E(d.color || 'arterial')}">
      <div class="cover">${MED.portada(d.portada || 'lamina', d.color, d.logo, d.id, d.cat)}<span class="num">LÁM. ${pad(d.n)}</span></div>
      <div class="body">
        <div class="meta">${MED.icono(d.logo, d.color, 34)}<span class="area">${E(d.cat || 'General')}</span>${d.formato ? `<span class="formato">· ${E(d.formato)}</span>` : ''}</div>
        <h2>${E(d.nombre)}</h2>
        <p>${E(d.desc)}</p>
        <div class="pie"><span class="state ${d.estado === 'dev' ? 'dev' : 'live'}">${d.estado === 'dev' ? 'En preparación' : 'Disponible'}</span>
          ${d.url ? `<a class="btn" href="${E(d.url)}" target="_blank" rel="noopener">Abrir lámina →</a>` : '<span class="soon">Próximamente</span>'}</div>
      </div>
    </article>`).join('');
  $('vacio').hidden = datos.length > 0;
  if (!datos.length) $('vacio').textContent = 'Todavía no hay láminas publicadas.';
}

(async () => {
  let lista = null, sitio = null;
  try { const a = await fetch('/api/proyectos', {cache: 'no-store'}); if (a.ok){ const j = await a.json(); lista = j.proyectos; sitio = j.sitio; } } catch(e) {}
  if (!Array.isArray(lista)){
    try { const r = await fetch('proyectos.json', {cache: 'no-store'}); if (r.ok){ const j = await r.json(); lista = j.proyectos; sitio = sitio || j.sitio; } } catch(e) {}
  }
  if (sitio){
    if (sitio.nombre){ $('nombre').textContent = sitio.nombre; document.title = sitio.nombre; $('pie').textContent = '© 2026 ' + sitio.nombre; }
    if (sitio.lema) $('lema').textContent = sitio.lema;
  }
  if (!Array.isArray(lista)){ $('vacio').textContent = 'No se pudieron cargar las láminas. Recarga la página.'; return; }
  datos = lista.sort((a, b) => (a.orden ?? 0) - (b.orden ?? 0));
  dibujar();
})();
</script>
</body>
</html>
